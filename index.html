<!DOCTYPE html>
<html lang="en">
<head>
<!-- Перехватчик JS-ошибок: ПЕРВЫМ и без defer, иначе падение старта
     страницы в отчёт не попадёт. Канон: ~/js-error-autofix/widget/. -->
<script>window.__fbConfig={"base": "https://stats.podlevskikh.com", "pos": "tl", "compact": "always"};window.__fbErrors=[];(function(){function p(e){try{if(window.__fbErrors.length<25)window.__fbErrors.push(e)}catch(x){}}
window.addEventListener("error",function(ev){var el=ev.target;if(el&&el!==window&&(el.tagName==="IMG"||el.tagName==="SCRIPT"||el.tagName==="LINK")){p({type:"resource",message:el.tagName+" failed: "+String(el.src||el.href||"").slice(0,300)});return}
p({type:"error",message:String(ev.message||"error").slice(0,500),source:String(ev.filename||"").slice(0,300),line:ev.lineno,col:ev.colno,stack:String((ev.error&&ev.error.stack)||"").slice(0,1500),early:true})},true);
window.addEventListener("unhandledrejection",function(ev){var r=ev.reason;p({type:"unhandledrejection",message:String((r&&(r.message||r))||"rejection").slice(0,500),stack:String((r&&r.stack)||"").slice(0,1500),early:true})})})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Interstellar — Relativistic Solar System Flight</title>
<!-- favicon -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="120x120" href="/favicon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  { "imports": { "three": "./lib/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- Language toggle (always visible) -->
  <div id="langtoggle"><span data-lang="en">EN</span><span data-lang="ru">RU</span></div>

  <!-- Start screen / how-to-fly -->
  <div id="startscreen">
    <div class="card">
      <div id="langtoggle2"><span data-lang="en">English</span><span data-lang="ru">Русский</span></div>
      <h1>INTERSTELLAR</h1>
      <p class="sub" data-i18n="start.sub"></p>
      <p data-i18n-html="start.intro"></p>
      <div class="controls" data-i18n-html="start.controls"></div>
      <p class="tip" data-i18n-html="start.tip"></p>
      <button id="startbtn" data-i18n="start.launch"></button>
    </div>
  </div>

  <!-- World-space overlay: body labels, target reticle, flight markers -->
  <div id="overlay"></div>

  <!-- Crosshair -->
  <div id="crosshair">+</div>

  <!-- Transient event log + live status line -->
  <div id="eventlog"></div>
  <div id="status" class="panel"></div>

  <!-- HUD -->
  <div id="hud" class="panel">
    <div class="row"><span data-i18n="hud.speed"></span><b id="speed">0</b></div>
    <div class="row"><span data-i18n="hud.gamma"></span><b id="gamma">1</b></div>
    <div class="row"><span data-i18n="hud.dilation"></span><b id="dilation">—</b></div>
    <div class="row"><span data-i18n="hud.accel"></span><b id="gforce">0 g</b></div>
    <hr/>
    <div class="row"><span data-i18n="hud.mode"></span><b id="mode">—</b></div>
    <div class="row"><span data-i18n="hud.throttle"></span><b id="throttle">0 %</b></div>
    <div class="row"><span data-i18n="hud.fuel"></span><b id="fuel">∞</b></div>
    <hr/>
    <div class="row"><span data-i18n="hud.ref"></span><b id="refbody">—</b></div>
    <div class="row"><span data-i18n="hud.alt"></span><b id="altitude">—</b></div>
    <div class="row"><span data-i18n="hud.atmo"></span><b id="atmo">—</b></div>
  </div>

  <div id="nav" class="panel">
    <div class="row"><span data-i18n="nav.target"></span><b id="target">—</b></div>
    <div class="row"><span data-i18n="nav.distance"></span><b id="tgtdist">—</b></div>
    <div class="row"><span data-i18n="nav.eta"></span><b id="tgteta">—</b></div>
    <div class="row"><span data-i18n="nav.periapsis"></span><b id="periapsis">—</b></div>
    <div class="row"><span data-i18n="nav.apoapsis"></span><b id="apoapsis">—</b></div>
    <div class="row"><span data-i18n="nav.closespeed"></span><b id="closespeed">—</b></div>
    <div class="row"><span data-i18n="nav.closedist"></span><b id="closedist">—</b></div>
    <div class="row"><span data-i18n="nav.closeeta"></span><b id="closeeta">—</b></div>
    <hr/>
    <div class="row"><span data-i18n="nav.simtime"></span><b id="simtime">0</b></div>
    <div class="row"><span data-i18n="nav.shiptime"></span><b id="shiptime">0</b></div>
    <div class="row"><span data-i18n="nav.warp"></span><b id="warp">1×</b></div>
    <div class="row"><span data-i18n="nav.fps"></span><b id="fps">—</b></div>
  </div>

  <div id="help" class="panel" data-i18n-html="help.html"></div>

  <!-- Гейт WebGL. Без контекста three.js падает первой же строкой
       (Uncaught Error: Error creating WebGL context) — симуляция не стартует,
       человек видит ЧЁРНЫЙ ЭКРАН без единого слова (жалоба 2026-07-30).
       Проверяем сами: есть контекст — грузим симуляцию, нет — объясняем. -->
  <script>
  (function () {
    var ok = false;
    try {
      var c = document.createElement('canvas');
      ok = !!(window.WebGLRenderingContext &&
        (c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) { ok = false; }

    if (ok) {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/main.js';
      document.body.appendChild(s);
      return;
    }

    var ru = (navigator.language || 'en').slice(0, 2) === 'ru';
    var ss = document.getElementById('startscreen');
    if (ss) ss.style.display = 'none';

    var box = document.createElement('div');
    box.id = 'nowebgl';
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;' +
      'justify-content:center;padding:24px;background:#05070f;color:#dfe6f5;' +
      'font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:9999';
    box.innerHTML =
      '<div style="max-width:520px">' +
        '<h1 style="margin:0 0 12px;font-size:22px;letter-spacing:.04em">INTERSTELLAR</h1>' +
        '<p style="margin:0 0 12px">' +
          (ru ? 'Симуляция рисуется через <b>WebGL</b>, а этот браузер его сейчас не даёт — поэтому вместо полёта был бы чёрный экран.'
              : 'The simulation renders with <b>WebGL</b>, which this browser is not providing right now — that is why the screen would stay black.') +
        '</p>' +
        '<p style="margin:0 0 12px;color:#9fb0cc">' +
          (ru ? 'Что обычно помогает: включить аппаратное ускорение в настройках браузера, обновить драйвер видеокарты или открыть страницу в свежем Chrome / Firefox / Safari на устройстве с GPU.'
              : 'What usually helps: enable hardware acceleration in browser settings, update the GPU driver, or open the page in an up-to-date Chrome / Firefox / Safari on a machine with a GPU.') +
        '</p>' +
        '<p style="margin:0;color:#9fb0cc;font-size:14px">' +
          (ru ? 'Проверить поддержку: ' : 'Check support: ') +
          '<a href="https://get.webgl.org/" style="color:#7fb3ff">get.webgl.org</a>' +
        '</p>' +
      '</div>';
    document.body.appendChild(box);
  })();
  </script>

  <script>window.addEventListener("load",function(){try{window.goatcounter=window.goatcounter||{};window.goatcounter.path=function(p){return location.host+(p==="/"?"/index":p)};var s=document.createElement("script");s.async=true;s.src="https://stats.podlevskikh.com/count.js";s.setAttribute("data-goatcounter","https://stats.podlevskikh.com/count");s.onerror=function(){};document.body.appendChild(s)}catch(e){}});</script>

<!-- RR-SNIPPET: session-replay (клики / время на странице). Неблокирующий: грузится
     после window.load, ошибки проглатываются, готовность сайта от него не зависит.
     Вся логика централизована в recorder.js на stats-хосте; запись сессий (rrweb)

<script>window.addEventListener("load",function(){try{
  var s=document.createElement("script");s.async=true;
  s.src="https://stats.podlevskikh.com/rr/static/recorder.js";s.onerror=function(){};
  document.body.appendChild(s);
}catch(e){}});</script>
